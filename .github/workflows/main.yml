name: Shed Streaming

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */5 * * *"

jobs:
  shed:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up \
            --auth-key="${{ secrets.TS_AUTHKEY }}" \
            --hostname="github-shed"

      - name: Get Tailscale IP
        run: |
          echo "================================"
          echo "Shed Tailscale IP:"
          sudo tailscale ip -4
          echo "================================"
          echo "Shed URL:"
          echo "http://$(sudo tailscale ip -4):8080"
          echo "================================"

      - name: Create Shed data
        run: |
          mkdir -p "$GITHUB_WORKSPACE/shed-data"

      - name: Start Shed
        run: |
          docker rm -f shed 2>/dev/null || true

          docker run -d \
            --name shed \
            --restart unless-stopped \
            -p 8080:8080 \
            -p 1935:1935 \
            -p 9000:9000/udp \
            -v "$GITHUB_WORKSPACE/shed-data:/data" \
            ghcr.io/muxshed/shed:latest

      - name: Show status
        run: |
          sleep 10
          docker ps
          docker logs --tail 100 shed

          echo ""
          echo "================================"
          echo "OPEN SHED:"
          echo "http://$(sudo tailscale ip -4):8080"
          echo "================================"

      - name: Keep Shed running
        run: |
          while true; do
            echo "Shed is running..."
            docker ps --filter name=shed
            sleep 60
          done
