name: Octoplex

on:
  workflow_dispatch:

jobs:
  octoplex:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up \
            --auth-key="${{ secrets.TS_AUTHKEY }}" \
            --hostname="github-octoplex"

      - name: Tailscale IP
        run: |
          IP=$(sudo tailscale ip -4)
          echo "================================"
          echo "Tailscale IP: $IP"
          echo "================================"

      - name: Build Octoplex
        run: |
          docker build -t octoplex:latest .

      - name: Start Octoplex
        run: |
          docker run -d \
            --name octoplex \
            --restart unless-stopped \
            -p 8080:8080 \
            -p 1935:1935 \
            -p 1936:1936 \
            octoplex:latest

      - name: Check
        run: |
          sleep 10
          docker ps
          docker logs --tail 100 octoplex

          IP=$(sudo tailscale ip -4)

          echo "================================"
          echo "WEB:"
          echo "http://$IP:8080"
          echo "================================"

      - name: Keep running
        run: |
          while true; do
            docker ps --filter name=octoplex
            sleep 60
          done
